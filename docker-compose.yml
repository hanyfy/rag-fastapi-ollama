services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      RETRIEVER: ${RETRIEVER:-tfidf}
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]
volumes:
  ollama:
